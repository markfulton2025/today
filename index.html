<style>

@media (max-width: 760px){

header{background:#FFFFFF}

let DATA = null, stamp = "", ITEMS = [], SEL = null;

function store(){ try { return JSON.parse(localStorage.getItem("logged-"+todayISO())||"{}"); } catch(e){ return {}; } }

function parseTime(t){ const m = String(t).match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i); if(!m) return null; let h=+m[1]%12; if(m[3].toUpperCase()==="PM") h+=12; return h+ (+m[2])/60; }

const SALT = "OaGayBd3ylRhZIj9eEz2gw==";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null;
async function deriveKey(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);

async function savedKey(){
  try { const raw = localStorage.getItem("today-key"); if (!raw) return null; return await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["decrypt"]); } catch(e){ return null; }
}
async function rememberKey(k){
  try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", k)); localStorage.setItem("today-key", btoa(String.fromCharCode(...raw))); } catch(e){}
}
async function decryptWith(k, env){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.iv)}, k, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function fetchEnv(){
  const r = await fetch("data.enc.json?t="+Date.now(), {cache:"no-store"});

function showLock(msg){

  ev.preventDefault();

  try {
    const hk = (location.hash.match(/[#&]k=([^&]+)/) || [])[1];
    if (!KEY && hk) { try { KEY = await deriveKey(decodeURIComponent(hk)); await rememberKey(KEY); } catch(e){ KEY = null; } }

    try { d = await decryptWith(KEY, env); } catch(e){ KEY = null; try { localStorage.removeItem("today-key"); } catch(_){} showLock("Password changed. Enter the new one."); return; }

  } catch(e) {
    if (!DATA) document.getElementById("meta").innerHTML = '<span class="err">Could not load today\'s list. Pull down to retry.</span>';

}

const TABS = [["today","Today"],["agents","Agents"],["refi","Refi"],["score","<span class=\"lf\">Scoreboard</span><span class=\"ls\">Score</span>"]];
let TAB = (() => { try { const t = localStorage.getItem("today-tab"); return TABS.some(x=>x[0]===t) ? t : "today"; } catch(e){ return "today"; } })();
const tabOf = g => g.tab || "today";
let ALLGROUPS = [];

function build(){
  const d = DATA;
  document.title = "Today · " + (d.dateShort || "");
  document.getElementById("title").textContent = d.dateShort ? d.dateShort.replace(/^(\w+)\s/, "$1, ") : (d.dateLabel || "Today");
  const g0 = gone();
  ALLGROUPS = (d.groups||[]).map(g => Object.assign({}, g, {items: (g.items||[]).filter(it => !g0[it.key])})).filter(g => g.items.length);
  ITEMS = [];
  ALLGROUPS.filter(g => tabOf(g) === TAB).forEach(g => g.items.forEach(it => ITEMS.push(Object.assign({group:g.title}, it))));
  if (!SEL || !ITEMS.find(i => i.key === SEL)) SEL = nextOpen(null);
  renderTabs(); renderTimeline(); renderList(); renderDetail(); renderMeta();
}
function setTab(t){
  TAB = t; try { localStorage.setItem("today-tab", t); } catch(e){}
  SEL = null; document.getElementById("shell").classList.remove("detail"); build(); window.scrollTo(0,0);
}
function tabCount(t){
  const logged = store();
  return ALLGROUPS.filter(g => tabOf(g) === t).reduce((a,g) => a + g.items.filter(i => !i.fyi && !logged[i.key]).length, 0);
}
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(([id,label]) => { const n = id === "score" ? 0 : tabCount(id);
    return `<button type="button" class="tab ${TAB===id?"on":""}" data-tab="${id}">${label}${n?` <span class="cnt">${n}</span>`:""}</button>`; }).join("");
  el.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
}

function nextOpen(afterKey){
  const logged = store();
  const open = ITEMS.filter(i => !i.fyi && !logged[i.key]);
  if (!open.length) return null;
  if (!afterKey) return open[0].key;
  const idx = ITEMS.findIndex(i => i.key === afterKey);
  const later = ITEMS.slice(idx+1).find(i => !i.fyi && !logged[i.key]);
  return (later || open[0]).key;
}

/* wins: Pipedrive count at refresh time + sends on this device since then */
function localSince(filterFn){
  const gen = DATA.generatedAt || 0, logged = store();
  return Object.entries(logged).filter(([k,t]) => t > gen && (!filterFn || filterFn(k))).length;
}
function winsNow(){
  const w = DATA.wins || {}, loc = localSince();
  const today = (w.isToday === false ? 0 : (w.today||0)) + loc;
  return { today, streak: (w.streakBefore||0) + (today > 0 ? 1 : 0), week: (w.week||0) + loc };
}
function agentWeekNow(){
  const a = DATA.agentWeek || {goal:7, count:0, names:[]};
  const agentKeys = new Set(ALLGROUPS.filter(g => tabOf(g)==="agents").flatMap(g => g.items.map(i => i.key)));
  return { goal: a.goal || 7, count: (a.count||0) + localSince(k => agentKeys.has(k)), names: a.names || [] };
}
function renderMeta(){
  const w = winsNow();

function renderTimeline(){
  const tl = document.getElementById("timeline");
  tl.innerHTML = '<div class="rail"></div>';
  const START = 7, END = 19, now = new Date(), nh = now.getHours() + now.getMinutes()/60;
  const isToday = DATA.dateShort && DATA.dateShort.endsWith((now.getMonth()+1)+"/"+now.getDate());
  const evs = (DATA.schedule||[]).map(s => ({s, h: parseTime(s.time)})).filter(x => x.h !== null);
  let nextMarked = false;
  evs.forEach(x => {
    const el = document.createElement("div");
    const pct = Math.min(96, Math.max(0, (x.h - START) / (END - START) * 100));
    el.className = "ev"; el.style.left = pct + "%";
    if (!nextMarked && (!isToday || x.h >= nh)) { el.classList.add("next"); nextMarked = true; }
    el.textContent = x.s.time.replace(/\s?(AM|PM)/i, "") + " " + x.s.title.replace(/^Call:\s*/, "").split(/[&,]/)[0].trim();
    tl.appendChild(el);
  });
  if (isToday && nh > START && nh < END) { const n = document.createElement("div"); n.className = "now"; n.style.left = ((nh-START)/(END-START)*100)+"%"; tl.appendChild(n); }
}

  return fetch(DISMISS_HOOK, {method:"POST", mode:"no-cors", body});
}
function mdy(d){ return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear(); }
function hideAndNext(it){
  const o = gone(); o[it.key] = Date.now(); saveGone(o);
  const next = nextOpen(it.key); build(); SEL = next && next !== it.key ? next : nextOpen(null); renderList(); renderDetail(); renderMeta();

function moreHTML(it){

function wireMore(it){

    const act = c.dataset.act;
    if (act === "snooze") {
      show(`<div class="lbl">Snooze until</div><div class="opts">${[[3,"3 days"],[7,"1 week"],[14,"2 weeks"],[30,"1 month"]].map(([n,l]) => { const d = new Date(Date.now()+n*864e5); return `<button type="button" class="chip" data-days="${n}">${l} <span class="s">${(d.getMonth()+1)+"/"+d.getDate()}</span></button>`; }).join("")}</div>`);

        try { await postNote(it, "Snoozed from Today page until " + mdy(d) + "."); hideAndNext(it); } catch(e){ b.disabled = false; b.textContent = "Didn't go through, tap again"; }

async function logSend(it, prefix, note, btn){
  if (btn) { btn.disabled = true; btn.textContent = "Logging..."; }
  const body = new URLSearchParams({ deal_id:String(it.dealId||""), person_id:String(it.personId||""),
    subject:(prefix || (it.flag==="bday"?"Birthday text: ":it.phone?"Text: ":"Email: "))+it.name+" (Today page)", note, due_date:todayISO(), name:it.name });

    const bday = it.flag === "bday";
    if (!xb.classList.contains("arm")) { xb.classList.add("arm"); xb.textContent = bday ? "Tap again: no more birthday texts" : "Tap again to remove"; setTimeout(() => { if (xb.isConnected && xb.disabled !== true) { xb.classList.remove("arm"); xb.textContent = "✕ Remove"; } }, 4000); return; }
    xb.disabled = true; xb.textContent = "Removing...";
    const ds = mdy(new Date());
    const note = bday ? "Skip birthday text. Removed from the Today page on "+ds+". Don't show on future boards." : "Skipped from Today page on "+ds+". Off the board until the next follow-up is due.";
    try { await postNote(it, note); hideAndNext(it); }
    catch(e) { xb.disabled = false; xb.classList.remove("arm"); xb.textContent = "Didn't go through, tap again"; }
  });
  if (it.fyi) { document.getElementById("skip").addEventListener("click", () => { SEL = nextOpen(it.key); renderList(); renderDetail(); }); return; }
  const ta = document.getElementById("msg"), subj = document.getElementById("subj"), copy = document.getElementById("copy"), log = document.getElementById("log");
  const sendT = document.getElementById("sendT"), sendE = document.getElementById("sendE");
  if (it.emailText == null) it.emailText = it.phone ? (it.text || "") : (it.text || "");
  if (it.emailSubject == null) it.emailSubject = it.subject || "";
  const upd = () => {
    if (sendT) sendT.href = `sms:+1${it.phone}?&body=${encodeURIComponent(it.text||"")}`;
    if (sendE) sendE.href = `mailto:${it.email}?subject=${encodeURIComponent(it.emailSubject||"")}&body=${encodeURIComponent(it.emailText||"")}`;
  };
  const setMode = m => {
    it.mode = m; const em = m === "email";
    ta.value = em ? it.emailText : (it.text || "");
    subj.value = it.emailSubject || ""; subj.style.display = em ? "" : "none";
    main.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    if (sendT) sendT.classList.toggle("pri", !em);
    if (sendE) sendE.classList.toggle("pri", em);
    upd();
  };
  main.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.m)));
  ta.addEventListener("input", () => { if (it.mode === "email") it.emailText = ta.value; else it.text = ta.value; upd(); });
  subj.addEventListener("input", () => { it.emailSubject = subj.value; upd(); });
  if (sendT) sendT.addEventListener("click", () => { if (it.mode !== "text") setTimeout(() => setMode("text"), 0); });
  if (sendE) sendE.addEventListener("click", () => { if (it.mode !== "email") setTimeout(() => setMode("email"), 0); });
  setMode(it.mode);
  copy.addEventListener("click", () => {
    navigator.clipboard.writeText(ta.value).then(() => { copy.textContent="Copied"; setTimeout(()=>copy.textContent="Copy",1500); }).catch(() => { ta.focus(); ta.select(); });
  });
  log.addEventListener("click", () => { if (log.disabled) return;
    const em = it.mode === "email";
    logSend(it, it.flag==="bday" && !em ? null : (em ? "Email: " : "Text: "), em ? (it.emailSubject ? "Subject: "+it.emailSubject+"\n\n" : "")+it.emailText : (it.text||""), log); });
}

/* ---------- Leads section ---------- */
const LEADS_KEY = "__leads";
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
function getComm(){ try { return localStorage.getItem("lead-commission") || ""; } catch(e){ return ""; } }
function setComm(v){ try { localStorage.setItem("lead-commission", v); } catch(e){} }
function leadStats(){
  const L = DATA && DATA.leads; if (!L || !L.months) return null;
  const now = new Date(), yr = L.year || now.getFullYear();
  const cm = yr === now.getFullYear() ? now.getMonth() : 11;           // 0-based current month
  const dim = new Date(yr, cm+1, 0).getDate(), frac = yr === now.getFullYear() ? now.getDate()/dim : 1;
  const ms = L.months.map((m,i) => Object.assign({i}, m));
  const cur = ms[cm] || {leads:0,target:0};
  const ytdLeads = ms.slice(0, cm+1).reduce((a,m)=>a+(m.leads||0),0);
  const fullTgt = ms.slice(0, cm).reduce((a,m)=>a+(m.target||0),0);
  const paceTgt = fullTgt + (cur.target||0)*frac;
  const yearTgt = ms.reduce((a,m)=>a+(m.target||0),0);
  const y = L.ytd || {};
  return {L, ms, cm, cur, curPace:(cur.target||0)*frac, ytdLeads, paceTgt, yearTgt, won:y.won||0, open:y.open||0, lost:y.lost||0};
}
function barCls(p){ return p >= 100 ? "hi" : p < 80 ? "lo" : ""; }
function leadsRowHTML(){
  const st = leadStats(); if (!st) return "";
  const p = pct(st.ytdLeads, st.paceTgt);
  return `<div class="gh">Scoreboard</div><button type="button" class="row lead-row ${SEL===LEADS_KEY?"sel":""}" data-key="${LEADS_KEY}">
    <span class="dot"></span><span style="min-width:0"><span class="nm">📈 Leads ${st.L.year}</span><span class="sub">${st.ytdLeads} YTD · ${st.cur.leads||0} this month</span></span>
    <span class="age">${p}%</span></button>`;
}
function leadsHTML(){
  const st = leadStats();
  if (!st) return `<div class="empty">Lead numbers show up after the next refresh.</div>`;
  const {ms, cm, cur} = st, mp = pct(cur.leads||0, cur.target), yp = pct(st.ytdLeads, st.paceTgt);
  const conv = st.ytdLeads ? (st.won/st.ytdLeads*100).toFixed(1) : "0.0";
  const mname = cur.m || "";
  const rows = ms.map(m => {
    const fut = m.i > cm, p = fut ? 0 : pct(m.leads||0, m.target);
    return `<tr class="${m.i===cm?"cur":""} ${fut?"fut":""}"><td>${esc(m.m)}</td><td>${fut?"":(m.leads||0)}</td><td>${m.target||0}</td><td>${fut?"":p+"%"}</td><td>${fut?"":(m.won||0)}</td><td class="pb">${fut?"":`<div class="bar"><i class="${barCls(p)}" style="width:${Math.min(100,p)}%"></i></div>`}</td></tr>`;
  }).join("");
  return `<div class="dh"><div><h2>Leads ${st.L.year}</h2><div class="info">New deals added in Pipedrive (all pipelines except TLC Onboarding) · as of ${esc(st.L.asOf||"")}</div></div></div>
  <div class="kpis">
    <div class="kpi"><div class="k">${esc(mname)} so far</div><div class="v">${cur.leads||0} <span class="s">/ ${cur.target||0}</span></div><div class="s">${mp}% of the month's goal</div><div class="bar"><i class="${barCls(pct(cur.leads||0, st.curPace))}" style="width:${Math.min(100,mp)}%"></i></div></div>
    <div class="kpi"><div class="k">YTD vs pace</div><div class="v">${st.ytdLeads} <span class="s">/ ${Math.round(st.paceTgt)}</span></div><div class="s">${yp}% to goal through today · year goal ${st.yearTgt}</div><div class="bar"><i class="${barCls(yp)}" style="width:${Math.min(100,yp)}%"></i></div></div>
    <div class="kpi"><div class="k">Conversion</div><div class="v">${conv}%</div><div class="s">${st.won} won · ${st.open} open · ${st.lost} lost</div></div>
  </div>
  <section><h3 class="lbl">What's a lead worth?</h3>
    <div class="comm"><label class="in" for="comm"><span>$</span><input id="comm" type="text" inputmode="decimal" placeholder="avg commission" value="${esc(getComm())}" autocomplete="off"></label>
    <span class="s">per funded loan</span></div>
    <div class="kpis" style="margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr))">
      <div class="kpi"><div class="k">$ per lead</div><div class="v" id="perlead">–</div><div class="s">won × commission ÷ leads</div></div>
      <div class="kpi"><div class="k">Commission YTD</div><div class="v" id="commytd">–</div><div class="s">${st.won} won × commission</div></div>
    </div>
    <p class="note" style="margin-top:8px">Recent months still have open deals in process, so these numbers climb as those close.</p>
  </section>
  <section><h3 class="lbl">Month by month</h3>
  <table class="ltbl"><thead><tr><th>Month</th><th>Leads</th><th>Target</th><th>% to goal</th><th>Won</th><th class="pb"></th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td>YTD</td><td>${st.ytdLeads}</td><td>${Math.round(st.paceTgt)}</td><td>${yp}%</td><td>${st.won}</td><td class="pb"></td></tr></tfoot></table>
  <p class="note" style="margin-top:6px">YTD target counts full months plus ${esc(mname)} prorated to today.</p></section>`;
}
function wireLeads(root){
  const inp = root.querySelector("#comm"); if (!inp) return;
  const st = leadStats();
  const calc = () => {
    const c = parseFloat(String(inp.value).replace(/[^0-9.]/g, ""));
    const ok = st && c > 0 && st.ytdLeads > 0;
    root.querySelector("#perlead").textContent = ok ? money(st.won*c/st.ytdLeads) : "–";
    root.querySelector("#commytd").textContent = ok ? money(st.won*c) : "–";
  };
  inp.addEventListener("input", () => { setComm(inp.value); calc(); });
  calc();
}

document.getElementById("lockform").addEventListener("submit", unlock);
load();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
setInterval(load, 10*60*1000);
</script>
