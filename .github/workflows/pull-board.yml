# Today page robot.
# Claude's scheduled refresh can't push to GitHub, so it drops the ENCRYPTED
# board (same JSON as data.enc.json) into a public-link Google Drive folder.
# This workflow runs on GitHub's own servers every ~10 minutes, grabs the
# newest file from that folder, and commits it as data.enc.json if it's newer.
# Only encrypted data ever passes through Drive or this repo.

name: Pull board from Drive

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/pull-board.yml"
      - "tools/pull_board.py"

permissions:
  contents: write
  pages: write

concurrency:
  group: pull-board
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Drive folder "Today page - encrypted handoff" (encrypted files only)
      FOLDER_ID: ${{ vars.TODAY_DRIVE_FOLDER || '1fwNOGICDMRDH1nVyWT6SX6d4AACA1Pci' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newest encrypted board
        id: fetch
        run: python3 tools/pull_board.py "$FOLDER_ID" data.enc.json

      - name: Commit if changed
        if: steps.fetch.outputs.updated == 'true'
        run: |
          git config user.name "today-robot"
          git config user.email "today-robot@users.noreply.github.com"
          git add data.enc.json
          git commit -m "Refresh ${{ steps.fetch.outputs.stamp }} (robot)"
          git push

      - name: Kick Pages build
        if: steps.fetch.outputs.updated == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
